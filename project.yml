# Limbator — XcodeGen spec (source of truth ; project.pbxproj is generated).
# Generate:  xcodegen generate   (Codemagic runs this before resolve/build)
# Cible iOS 17+, Swift 5.10, Xcode 26.
#
# Gemma 4 via mlx-swift-lm NATIF (gemma4 dans LLM/VLMModelFactory). Pas de
# Gemma4Swift : un SEUL consommateur de mlx-swift => un seul target C `Cmlx`,
# donc pas de diamant de dépendances (ComputeTargetDependencyGraph OK).

name: Limbator
options:
  bundleIdPrefix: com.limbator
  developmentLanguage: ro
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Modules explicites Xcode 26 : sources de régressions de graphe SwiftPM sur
    # ce type de projet (MLX + xcframeworks). On garde le comportement implicite
    # (Xcode 16). Inerte si inutile ; à remettre YES quand Apple corrige.
    SWIFT_ENABLE_EXPLICIT_MODULES: NO
    CLANG_ENABLE_EXPLICIT_MODULES: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "BTMRPS8F79"

packages:
  # Gemma 4 natif (rebrand 2025 de mlx-swift-examples). Pinné par révision pour
  # un graphe déterministe — aucune résolution "main" surprise en CI.
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    revision: ee5320ddcf8cdc2765165e0350b1f9a76362a24a
  # Requis par l'expansion des macros (#huggingFaceTokenizerLoader) : le code
  # généré référence HuggingFace.HubClient + Tokenizers.AutoTokenizer.
  # Ne dépendent PAS de mlx-swift => n'introduisent pas de diamant.
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface.git
    from: "0.9.0"
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: "1.3.0"

targets:
  Limbator:
    type: application
    platform: iOS
    sources:
      - path: Limbator
        excludes:
          - "**/*.md"
          - "Resources/Info.plist"
          # Voice copié explicitement dans le .app via postBuildScripts (méthode
          # béton, indépendante de l'auto-classification des ressources XcodeGen).
          - "Resources/Voice/**"
    resources:
      - Limbator/Resources/Assets.xcassets
      - Limbator/Resources/PrivacyInfo.xcprivacy
    # Copie GARANTIE des assets voix (2 modèles VITS + tokens + espeak-ng-data)
    # à la RACINE du .app, juste avant la signature. NeuralVoiceEngine les cherche
    # à la racine du bundle.
    postBuildScripts:
      - name: Embed French neural voices into .app bundle
        script: |
          set -e
          SRC="$SRCROOT/Limbator/Resources/Voice"
          DEST="$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          COPIED=0
          for f in fr_female.onnx fr_female_tokens.txt fr_male.onnx fr_male_tokens.txt; do
            if [ -f "$SRC/$f" ]; then cp -f "$SRC/$f" "$DEST/$f"; COPIED=$((COPIED+1)); fi
          done
          if [ -d "$SRC/espeak-ng-data" ]; then
            rm -rf "$DEST/espeak-ng-data"
            cp -R "$SRC/espeak-ng-data" "$DEST/espeak-ng-data"
            COPIED=$((COPIED+1))
          fi
          if [ "$COPIED" -ge 5 ]; then
            echo "OK Embedded French neural voices ($COPIED items) into $DEST"
          else
            echo "WARN French voice assets incomplete ($COPIED/5) — app falls back to Apple Premium fr-FR"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.limbator.app
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        # LIMB_MLX_REAL : actif UNIQUEMENT sur SDK device (iphoneos). MLX est linké
        # partout mais abort sur simulateur => ce flag garde le vrai Gemma 4 pour le
        # device et le moteur déterministe pour simulateur/preview/tests.
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos*]": "$(inherited) LIMB_MLX_REAL"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Limbator/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Limbator/Limbator.entitlements
        # sherpa-onnx xcframeworks vendorisés dans Vendor/ par la CI.
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Vendor"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lc++"
    dependencies:
      # mlx-swift-lm (Gemma 4). MLX importable en transitif (ne PAS déclarer mlx-swift).
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXVLM
      - package: mlx-swift-lm
        product: MLXHuggingFace
      # Requis par l'expansion des macros mlx-swift-lm.
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
      # xcframeworks sherpa-onnx (statiques -> link only, pas d'embed).
      - framework: Vendor/sherpa-onnx.xcframework
        embed: false
      - framework: Vendor/onnxruntime.xcframework
        embed: false

  LimbatorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LimbatorTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.limbator.app.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Limbator

schemes:
  Limbator:
    build:
      targets:
        Limbator: all
        LimbatorTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LimbatorTests
    profile:
      config: Release
    archive:
      config: Release
